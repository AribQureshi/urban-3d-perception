name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies (geometry, tracking, risk need no GPU models)
        run: pip install numpy pandas scikit-learn pyyaml pytest
      - name: Run tests
        run: pytest -q tests
